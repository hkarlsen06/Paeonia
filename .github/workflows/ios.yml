name: iOS

on:
  pull_request:
    paths:
      - "ios/**"
      - "scripts/xcode-*-agent.sh"
      - "scripts/lock"
      - ".swiftlint.yml"
      - ".github/workflows/ios.yml"
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - "scripts/xcode-*-agent.sh"
      - "scripts/lock"
      - ".swiftlint.yml"
      - ".github/workflows/ios.yml"

jobs:
  ios:
    # The app builds against the iOS 27 SDK, which only this preview image has.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The same Xcode as the developer's Mac. See "Toolchain Requirement" in
      # docs/agent-guides/ios-verification.md.
      - name: Select Xcode 27.0
        run: |
          sudo xcode-select -s /Applications/Xcode_27.app/Contents/Developer
          xcodebuild -version

      - name: SwiftLint
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          swiftlint lint --quiet

      - name: Build the app and the test targets
        run: XCODE_BUILD_AGENT_ACTION=build-for-testing XCODE_BUILD_AGENT_FAIL_ON_WARNINGS=1 ./scripts/xcode-build-agent.sh

      # The wrapper prints only a summary. It keeps the xcodebuild log and the
      # result bundle (test durations, crash reports) when KEEP_ARTIFACTS is set.
      - name: Unit tests
        env:
          TMPDIR: ${{ runner.temp }}/xcode-test/
          XCODE_TEST_AGENT_KEEP_ARTIFACTS: "1"
        run: |
          mkdir -p "$TMPDIR"
          ./scripts/xcode-test-agent.sh -- -only-testing:PaeoniaAppTests

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ${{ runner.temp }}/xcode-test/
          retention-days: 7
