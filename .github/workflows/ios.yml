name: iOS

on:
  pull_request:
    paths:
      - "ios/**"
      - "scripts/xcode-*-agent.sh"
      - "scripts/lock"
      - "scripts/lib/**"
      - "scripts/xcode-download-cookie.rb"
      - ".swiftlint.yml"
      - ".github/workflows/ios.yml"
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - "scripts/xcode-*-agent.sh"
      - "scripts/lock"
      - "scripts/lib/**"
      - "scripts/xcode-download-cookie.rb"
      - ".swiftlint.yml"
      - ".github/workflows/ios.yml"

jobs:
  ios:
    # The app requires the iOS 27.3 SDK for custom Siri tools.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode with SDK 27.3 or newer
        env:
          FASTLANE_SESSION: ${{ secrets.XCODE_DOWNLOAD_SESSION }}
        run: |
          # Prefer the runner's installation once GitHub ships SDK 27.3.
          if ! (source scripts/lib/paeonia-xcode.sh) 2>/dev/null; then
            if [ -z "$FASTLANE_SESSION" ]; then
              echo "::error::SDK 27.3 is not installed. Refresh the XCODE_DOWNLOAD_SESSION repository secret with an authenticated Apple Developer download session."
              exit 1
            fi
            command -v xcodes >/dev/null || brew install xcodesorg/made/xcodes
            # Pin the beta that supplies the APIs used by our Siri tools.
            # Download auth outlives the App Store Connect session that xcodes validates.
            # Keep the cookie out of command arguments and remove it on every exit.
            cookie_file="$(mktemp)"
            archive="$RUNNER_TEMP/Xcode_27.3_beta.xip"
            trap 'rm -f "$cookie_file" "$archive"' EXIT
            ruby scripts/xcode-download-cookie.rb > "$cookie_file"
            curl --fail --location --retry 3 --proto '=https' \
              --cookie "$cookie_file" --output "$archive" \
              'https://download.developer.apple.com/Developer_Tools/Xcode_27.3_beta/Xcode_27.3_beta.xip'
            xcodes install '27.3 Beta' --path "$archive" --experimental-unxip --empty-trash </dev/null
          fi
          source scripts/lib/paeonia-xcode.sh
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: SwiftLint
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          swiftlint lint --quiet

      - name: Build the app and the test targets
        run: XCODE_BUILD_AGENT_ACTION=build-for-testing XCODE_BUILD_AGENT_FAIL_ON_WARNINGS=1 ./scripts/xcode-build-agent.sh

      # Shared iPhone belongs to the developer's Mac. Hosted runners have
      # their own preinstalled simulators, which need no shared simulator lock.
      - name: Select an installed iOS 27 simulator
        run: |
          destination="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if not runtime.startswith("com.apple.CoreSimulator.SimRuntime.iOS-27-"):
                  continue
              for device in devices:
                  if device["deviceTypeIdentifier"].startswith("com.apple.CoreSimulator.SimDeviceType.iPhone-"):
                      print("platform=iOS Simulator,id=" + device["udid"])
                      sys.exit(0)
          sys.exit("No installed iOS 27 iPhone simulator is available.")
          ')"
          echo "XCODE_TEST_AGENT_DESTINATION=$destination" >> "$GITHUB_ENV"

      # The wrapper prints only a summary. It keeps the xcodebuild log and the
      # result bundle (test durations, crash reports) when KEEP_ARTIFACTS is set.
      - name: Unit tests
        env:
          TMPDIR: ${{ runner.temp }}/xcode-test/
          XCODE_TEST_AGENT_KEEP_ARTIFACTS: "1"
        run: |
          mkdir -p "$TMPDIR"
          ./scripts/xcode-test-agent.sh -- -only-testing:PaeoniaAppTests

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: ${{ runner.temp }}/xcode-test/
          retention-days: 7
