# SwiftLint configuration for Paeonia.
#
# This mirrors Tidex's high-signal lint posture while omitting Tidex's baseline
# file because Paeonia starts without existing Swift debt.

included:
  - ios

excluded:
  - ios/Scripts/.build
  - ios/Pods
  - ios/DerivedData
  - ios/build
  - ios/.build
  - ios/vendor
  - ios/PaeoniaApp/Generated

reporter: xcode

opt_in_rules:
  - accessibility_label_for_image
  - accessibility_trait_for_button
  - array_init
  - async_without_await
  - closure_body_length
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discarded_notification_center_observer
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - fallthrough
  - fatal_error_message
  - first_where
  - force_unwrapping
  - last_where
  - legacy_random
  - number_separator
  - overridden_super_call
  - private_action
  - private_outlet
  - prohibited_super_call
  - redundant_nil_coalescing
  - toggle_bool
  - unavailable_function

analyzer_rules:
  - unused_declaration
  - unused_import

disabled_rules:
  # swift-format is the repository's formatting authority.
  - attributes
  - closure_end_indentation
  - closure_parameter_position
  - closure_spacing
  - collection_alignment
  - contrasted_opening_brace
  - implicit_return
  - indentation_width
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - multiple_closures_with_trailing_closure
  - opening_brace
  - operator_usage_whitespace
  - period_spacing
  - statement_position
  - trailing_closure
  - trailing_comma
  - trailing_newline
  - trailing_whitespace
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces

  # Mutually exclusive policies; use the stricter selected counterpart.
  - no_extension_access_modifier
  - object_literal
  - redundant_type_annotation

  # Project architecture intentionally permits declarations grouped by feature.
  - one_declaration_per_file

force_cast:
  severity: error

force_try:
  severity: error

force_unwrapping:
  severity: error

closure_body_length:
  warning: 30

cyclomatic_complexity:
  warning: 8
  ignores_case_statements: false

enum_case_associated_values_count:
  warning: 4

file_length:
  warning: 400
  ignore_comment_only_lines: true

function_body_length:
  warning: 40

function_parameter_count:
  warning: 5
  ignores_default_parameters: true

identifier_name:
  min_length:
    warning: 2
  max_length:
    warning: 40
  excluded:
    - id
    - x
    - y

large_tuple:
  warning: 2

line_length:
  warning: 120
  ignores_urls: true
  ignores_comments: false
  ignores_interpolated_strings: false
  ignores_multiline_strings: false

nesting:
  type_level:
    warning: 2
  function_level:
    warning: 2
  check_nesting_in_closures_and_statements: true
  ignore_coding_keys: true

type_body_length:
  warning: 250

type_name:
  min_length:
    warning: 2
  max_length:
    warning: 40

vertical_whitespace:
  max_empty_lines: 1

blanket_disable_command:
  severity: error
  allowed_rules: []
  always_blanket_disable: []

invalid_swiftlint_command:
  severity: error

superfluous_disable_command:
  severity: error

custom_rules:
  no_raw_localization_keys:
    name: Raw localization key
    regex: '(String\(localized:|LocalizedStringResource\(|NSLocalizedString\(|Text\()[ \t]*"[a-z][A-Za-z0-9]*(\.[A-Za-z0-9]+)+\"'
    message: Use the generated LocalizedStringResource symbol instead of a raw localization key.
    severity: error

  no_direct_print:
    name: Direct print
    regex: '(?<![A-Za-z0-9_])print\s*\('
    message: Use the project logging or diagnostics infrastructure instead of print().
    severity: error

  # The partner's own name shows through a nickname the person gave them. Views and view models take
  # the resolved name from PartnerName (ios/PaeoniaApp/Services/Access/PartnerName.swift) and never
  # read the partner's own name. Only the type and the nickname editor, which shows both, may.
  partner_account_name_read:
    name: Partner's own name read directly
    regex: '(?<=\.)(partnerAccountName|accountName)\b'
    match_kinds: identifier
    excluded: 'Services/Access/PartnerName\.swift|Features/Settings/PartnerNickname/'
    message: >-
      This reads the partner's own name, which ignores the nickname the person gave them. Use
      PartnerName.display or PartnerName.displayOrFallback (from AccessRouteResolution.partnerName, or the
      partnerDisplayName that already holds the resolved name).
    severity: error

  # A server field called display_name holds a person's own name. The server sends the partner's name
  # as partner_account_name next to partner_nickname, and PartnerName joins them. This catches a new
  # response model that decodes a display_name for a partner and shows it as is. Own-profile, admin and
  # invite-preview models are the only allowed places.
  no_raw_display_name_key:
    name: Raw display_name key
    regex: '"[a-z_]*display_name"'
    excluded: 'Features/Admin/|Services/Auth/|Services/Pairing/PairingModels\.swift|PaeoniaAppTests/'
    message: >-
      A display_name from the server is a person's own name. If it names the partner, ask the backend for
      a name resolved with nameForViewer instead, or build a PartnerName. Add the file to this rule's
      excluded list only for the signed-in person's own profile, admin tools or the invite preview.
    severity: error
